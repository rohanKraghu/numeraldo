<!DOCTYPE html><html><head><meta charset="utf-8">
<title>Open Graph card: Numeraldo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px}
body{
  background:#FFFFFF;color:#070E26;overflow:hidden;
  font-family:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  display:grid;grid-template-columns:1fr 374px;align-items:center;gap:50px;padding:0 76px;
}
.eyebrow{font-family:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;font-weight:500;font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:#4D5573}
h1{font-weight:600;font-size:50px;line-height:1.08;letter-spacing:-.03em;margin-top:20px}
h1 em{font-style:normal;color:#070E26;font-family:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;font-weight:500;font-size:.82em;letter-spacing:-.01em}
.foot{display:flex;align-items:baseline;gap:18px;margin-top:44px;padding-top:24px;border-top:1px solid #DADDE7}
.name{font-weight:800;font-size:25px;letter-spacing:-.025em}
.url{font-family:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;font-weight:500;font-size:15px;color:#4D5573}
.ledger{border:1px solid #DADDE7;background:#F4F5F9;padding:6px 28px}
.row{padding:24px 0;border-bottom:1px solid #DADDE7}
.row:last-child{border-bottom:0}
.k{display:block;font-family:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;font-weight:500;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:#4D5573}
.v{display:block;margin-top:8px;font-weight:600;font-size:40px;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.v.hl{color:#070E26}

body{font-family:Nunito,"Helvetica Neue",Arial,sans-serif;color:#1E2A78;position:relative;isolation:isolate}
body::before{content:"";position:absolute;z-index:-1;width:420px;height:420px;border-radius:50%;background:#D9F2EC;right:-120px;top:-170px}
body::after{content:"";position:absolute;z-index:-1;width:330px;height:330px;border-radius:50%;background:#FFF3D1;left:-130px;bottom:-150px}
.eyebrow,.k,.track .k{font-family:Nunito,sans-serif;font-weight:800;color:#3AA893}
h1{font-weight:900;color:#1E2A78}
h1 em{font-family:Nunito,sans-serif;font-weight:900;color:#57C2AE;font-size:1em;letter-spacing:-.03em}
.chip{font-family:Nunito,sans-serif;font-weight:700;color:#1E2A78;border-color:#C9CEEA}
.chip.on{background:#FFC94A;border-color:#FFC94A;color:#1E2A78}
.foot{border-top:0;align-items:center;gap:14px}
.foot img{width:52px;height:52px}
.name{font-weight:900;color:#1E2A78}
.url{font-family:Nunito,sans-serif;font-weight:700;color:#4D5573}
.ledger,.track{background:#fff;border:0;border-radius:24px;box-shadow:0 14px 34px rgba(30,42,120,.14)}
.ledger{border-bottom:6px solid #57C2AE}
.track{border-bottom:6px solid #57C2AE}.track+.track{border-bottom-color:#FFC94A}
.row{border-bottom-color:#E6E8F0}
.v,.track .t{font-family:Nunito,sans-serif;font-weight:900;color:#1E2A78}
.v.hl{color:#1E2A78;background:#FFF3D1;border-radius:12px;display:inline-block;padding:0 10px;margin-left:-10px}
.track .s{font-family:Nunito,sans-serif;font-weight:700}
</style></head><body>
<div>
  <div class="eyebrow">Numeracy education &middot; 501(c)(3) nonprofit</div>
  <h1>Expanding world numeracy<br><em>one number at a time.</em></h1>
  <div class="foot"><img src="../assets/numeraldo-fun-mark-sun.svg" alt=""><span class="name">Numeraldo</span><span class="url">numeraldo.org</span></div>
</div>
<div class="ledger">
  <div class="row"><span class="k">Raised to date</span><span class="v hl">$14,250</span></div>
  <div class="row"><span class="k">Students taught weekly</span><span class="v">40+</span></div>
  <div class="row"><span class="k">Partner organizations</span><span class="v">3</span></div>
</div>
</body></html>
