<!DOCTYPE html><html><head><meta charset="utf-8">
<title>LinkedIn banner: Numeraldo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1128px;height:191px}
body{background:#1E2A78;color:#fff;font-family:Nunito,Arial,sans-serif;overflow:hidden;position:relative;isolation:isolate;
  display:flex;align-items:center;justify-content:flex-end;padding:0 56px}
body::before{content:"";position:absolute;z-index:-1;width:300px;height:300px;border-radius:50%;background:#57C2AE;opacity:.9;left:150px;top:-200px}
body::after{content:"";position:absolute;z-index:-1;width:240px;height:240px;border-radius:50%;background:#FFC94A;left:-60px;bottom:-150px}
.dot{position:absolute;z-index:-1;width:70px;height:70px;border-radius:50%;background:#2E3C94;left:420px;bottom:-20px}
.txt{text-align:right}
h1{font-weight:900;font-size:40px;letter-spacing:-.02em;line-height:1.05}
h1 em{font-style:normal;color:#FFC94A}
p{margin-top:10px;font-weight:800;font-size:16px;letter-spacing:.12em;text-transform:uppercase;color:#D9F2EC}
</style></head><body><span class="dot"></span>
<div class="txt"><h1>Expanding world numeracy,<br><em>one number at a time.</em></h1><p>numeraldo.org &middot; 501(c)(3) nonprofit</p></div>
</body></html>
